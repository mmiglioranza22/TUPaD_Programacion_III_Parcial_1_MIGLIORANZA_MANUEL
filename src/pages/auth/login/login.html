<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Food Store</title>
  </head>

  <body>
    <h1>Login</h1>

    <form id="form">
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="off"
          placeholder="example@example.com"
          required
        />
      </div>
      <div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="off"
          placeholder="********"
          required
        />
      </div>

      <p id="mensaje-error" style="color: red"></p>

      <button type="submit">Ingresar</button>
    </form>

    <p>
      ¿No tenés cuenta?
      <a href="/src/pages/auth/registro/registro.html">Registrate</a>
    </p>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./login.ts"></script>
  </body>
</html>

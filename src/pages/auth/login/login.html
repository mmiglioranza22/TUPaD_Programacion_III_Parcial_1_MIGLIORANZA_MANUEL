<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Food Store</title>
    <link rel="stylesheet" href="../../../style.css" />
  </head>

  <body>
    <div class="login-container">
      <form id="form" class="login-card">
        <h1 class="logo">Food Store</h1>
        <h2 class="subtitle">Iniciar Sesión</h2>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="off"
            placeholder="example@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="off"
            placeholder="********"
            required
          />
        </div>

        <p id="mensaje-error" style="color: red"></p>

        <button type="submit" class="btn-ingresar">Ingresar</button>
        <p class="register-link">
          ¿No tenés cuenta?
          <a href="/src/pages/auth/registro/registro.html">Registrate</a>
        </p>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./login.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Food Store</title>
    <link rel="stylesheet" href="../../../style.css" />
  </head>

  <body>
    <div class="register-container">
      <form class="register-card" id="form">
        <h1 class="logo">Crear cuenta</h1>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="off"
            placeholder="example@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="off"
            placeholder="********"
            required
          />
        </div>

        <p id="mensaje-error" style="color: red"></p>

        <button type="submit" class="btn-registrar">Registrarme</button>

        <p class="login-link">
          ¿Ya tenés cuenta?
          <a href="/src/pages/auth/login/login.html">Ingresá acá</a>
        </p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./registro.ts"></script>
  </body>
</html>
